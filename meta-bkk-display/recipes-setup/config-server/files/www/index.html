<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BKK Display Setup</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="setup-card">
    <h1>BKK Display Setup</h1>

    <!-- shown while fetching mode from the server -->
    <div id="page-loading" class="page">
      <p class="muted">Loading&hellip;</p>
    </div>

    <!-- Phase 1: WiFi credentials -->
    <div id="page-wifi" class="page" style="display:none">
      <h2>WiFi Configuration</h2>
      <p class="muted">Connect the device to your local network.</p>

      <label for="wifi-ssid">SSID</label>
      <input type="text" id="wifi-ssid" placeholder="Network name" autocomplete="off">

      <label for="wifi-password">Password</label>
      <input type="password" id="wifi-password" placeholder="Leave empty for open networks">

      <div class="actions">
        <button id="btn-wifi-apply" onclick="applyWifi()">Apply &amp; Reboot</button>
      </div>
    </div>

    <div id="page-api" class="page" style="display:none">
      <h2>API Configuration</h2>
      <p class="muted">Enter your BKK API key and the station IDs to display.</p>

      <label for="api-key">API key</label>
      <input id="api-key" type="password" autocomplete="off">

      <label for="station-ids">Station IDs</label>
      <textarea id="station-ids" placeholder="Comma-separated station IDs"></textarea>

      <div class="actions">
        <button id="btn-api-finish" type="button" onclick="finishApi()">Finish</button>
      </div>
    </div>

    <!-- Shown after successful completion of either phase -->
    <div id="page-done" class="page" style="display:none">
      <div class="done-icon">&#10003;</div>
      <h2 id="done-title">Done</h2>
      <p class="muted" id="done-message"></p>
    </div>

    <p id="status-msg" class="status" style="display:none"></p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
