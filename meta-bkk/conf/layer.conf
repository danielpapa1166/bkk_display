# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-bkk"
BBFILE_PATTERN_meta-bkk = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-bkk = "6"

LAYERDEPENDS_meta-bkk = "core openembedded-layer"
LAYERSERIES_COMPAT_meta-bkk = "kirkstone"
